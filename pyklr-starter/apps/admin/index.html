<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PYKLR Admin</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">
    <!-- Login -->
    <div id="login-screen" class="screen active">
      <div class="login-card">
        <div class="logo">PYKLR</div>
        <div class="tagline">Admin Dashboard</div>
        <input type="email" id="email" placeholder="Admin email" />
        <input type="password" id="password" placeholder="Password" />
        <button onclick="handleLogin()" id="login-btn">Sign in</button>
        <div id="login-error" class="error"></div>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-screen" class="screen">
      <nav class="sidebar">
        <div class="sidebar-logo">PYKLR</div>
        <div class="sidebar-label">ADMIN</div>
        <a class="nav-item active" data-tab="overview" onclick="switchTab('overview')">📊 Overview</a>
        <a class="nav-item" data-tab="courts" onclick="switchTab('courts')">📍 Courts</a>
        <a class="nav-item" data-tab="users" onclick="switchTab('users')">👥 Users</a>
        <a class="nav-item" data-tab="events" onclick="switchTab('events')">📅 Events</a>
        <a class="nav-item" data-tab="reports" onclick="switchTab('reports')">🚩 Reports</a>
        <a class="nav-item" data-tab="forum" onclick="switchTab('forum')">💬 Forum</a>
        <div class="sidebar-footer">
          <button onclick="handleLogout()" class="btn-ghost">Sign out</button>
        </div>
      </nav>

      <main class="content">
        <!-- Overview -->
        <section id="tab-overview" class="tab active">
          <h1>Dashboard</h1>
          <div class="stat-grid" id="stats"></div>
          <h2>Recent Activity</h2>
          <div id="recent-activity" class="table-wrap"></div>
        </section>

        <!-- Courts -->
        <section id="tab-courts" class="tab">
          <div class="tab-header">
            <h1>Courts</h1>
            <div class="filter-row">
              <button class="chip active" onclick="filterCourts('all')">All</button>
              <button class="chip" onclick="filterCourts('pending')">Pending</button>
              <button class="chip" onclick="filterCourts('approved')">Approved</button>
            </div>
          </div>
          <div id="courts-table" class="table-wrap"></div>
        </section>

        <!-- Users -->
        <section id="tab-users" class="tab">
          <div class="tab-header">
            <h1>Users</h1>
            <input type="text" id="user-search" placeholder="Search users…" oninput="searchUsers(this.value)" />
          </div>
          <div id="users-table" class="table-wrap"></div>
        </section>

        <!-- Events -->
        <section id="tab-events" class="tab">
          <h1>Events</h1>
          <div id="events-table" class="table-wrap"></div>
        </section>

        <!-- Reports -->
        <section id="tab-reports" class="tab">
          <h1>Reports</h1>
          <div id="reports-table" class="table-wrap"></div>
        </section>

        <!-- Forum -->
        <section id="tab-forum" class="tab">
          <div class="tab-header">
            <h1>Forum Posts</h1>
            <div class="filter-row">
              <button class="chip active" onclick="filterForum('all')">All</button>
              <button class="chip" onclick="filterForum('flagged')">Flagged</button>
            </div>
          </div>
          <div id="forum-table" class="table-wrap"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
